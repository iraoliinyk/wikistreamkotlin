name: Build, Test
run-name: Build and test on ${{ github.ref_name }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - ch-4

permissions:
  contents: read
  packages: write

jobs:
  lintKotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run lint checks
        run: ./gradlew lintKotlin --stacktrace

  unitTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run unit tests
        run: ./gradlew unitTest

  integrationTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run integration tests
        env:
          APP_JWT_ISSUER: wikistreamkotlin-ci
          APP_JWT_SECRET: wikistreamkotlin-ci-secret-at-least-32-chars
          APP_JWT_ACCESS_TOKEN_TTL_SECONDS: "3600"
        run: ./gradlew integrationTest

  publishImage:
    runs-on: ubuntu-latest
    needs: [lintKotlin, unitTest, integrationTest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/ch-4'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/github.iraoliinyk/wikistreamkotlin
          tags: |
            type=raw,value=ch-4
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max