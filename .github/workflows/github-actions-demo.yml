name: Build, Test
run-name: Build and test on ${{ github.ref_name }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - ch-4

permissions:
  contents: read
  packages: write

jobs:
  lintKotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run lint checks
        run: ./gradlew lintKotlin --stacktrace

  unitTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run unit tests
        run: ./gradlew unitTest

  integrationTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run integration tests
        env:
          APP_JWT_ISSUER: wikistreamkotlin-ci
          APP_JWT_SECRET: wikistreamkotlin-ci-secret-at-least-32-chars
          APP_JWT_ACCESS_TOKEN_TTL_SECONDS: "3600"
        run: ./gradlew integrationTest
