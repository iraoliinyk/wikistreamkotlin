name: Build, Test
run-name: Build and test on ${{ github.ref_name }}
on:
  push:
    branches:
      - ch-4

permissions:
  contents: read
  packages: write

jobs:
  lintKotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run lint checks
        run: ./gradlew lintKotlin --stacktrace

  unitTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run unit tests
        run: ./gradlew unitTest

  integrationTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Start dependencies for integration tests
        run: docker compose up -d
      - name: Run integration tests
        run: ./gradlew integrationTest
      - name: Tear down dependencies
        if: always()
        run: docker compose down
