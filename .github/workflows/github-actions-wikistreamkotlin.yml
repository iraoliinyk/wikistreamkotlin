name: Build, Test
run-name: Build and test on ${{ github.ref_name }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  lintKotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run lint checks
        run: ./gradlew lintKotlin --stacktrace

  unitTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run unit tests
        run: ./gradlew unitTest

  integrationTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run integration tests
        env:
          APP_SECURITY_JWT_ISSUER: wikistreamkotlin-ci
          APP_SECURITY_JWT_SECRET: wikistreamkotlin-ci-secret-at-least-32-chars
          APP_SECURITY_JWT_ACCESS_TOKEN_TTL_SECONDS: "3600"
        run: ./gradlew integrationTest

  publishImages:
    runs-on: ubuntu-latest
    needs: [lintKotlin, unitTest, integrationTest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - { name: consumer, dockerfile: Dockerfile.consumer }
          - { name: producer, dockerfile: Dockerfile.producer }
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image repository for ${{ matrix.service.name }}
        id: image
        shell: bash
        run: |
          set -euo pipefail
          raw_image=$(awk '
            /^[[:space:]]*${{ matrix.service.name }}:[[:space:]]*$/ { in_service=1; next }
            in_service && /^[[:space:]]*[a-zA-Z0-9_-]+:[[:space:]]*$/ { in_service=0 }
            in_service && /^[[:space:]]*image:[[:space:]]*/ { print $2; exit }
          ' docker-compose.yml)

          if [[ -z "${raw_image:-}" ]]; then
            echo "Could not resolve image for service '${{ matrix.service.name }}' from docker-compose.yml" >&2
            exit 1
          fi

          image_no_tag="${raw_image%:*}"
          if [[ "$image_no_tag" == "ghcr.io/"* ]]; then
            image_repo="$image_no_tag"
          else
            image_repo="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image_no_tag##*/}"
          fi

          echo "image_repo=$image_repo" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image_repo }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push ${{ matrix.service.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
