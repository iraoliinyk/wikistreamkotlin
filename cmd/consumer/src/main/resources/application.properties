spring.application.name=wikistreamkotlin
spring.jackson.serialization.indent-output=true
spring.config.import[0]=optional:file:./config/auth-secrets.properties
spring.config.import[1]=optional:file:./config/cassandra-astra-secrets.properties
server.port=7000

app.auth.enabled=${APP_AUTH_ENABLED:true}

spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:localhost}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE_NAME:wikistream}
spring.cassandra.local-datacenter=${CASSANDRA_LOCAL_DATACENTER:datacenter1}
spring.cassandra.schema-action=${CASSANDRA_SCHEMA_ACTION:NONE}
spring.cassandra.request.timeout=10s
spring.cassandra.connection.connect-timeout=5s
spring.cassandra.connection.init-query-timeout=5s
# Fail fast on startup if Cassandra is unreachable (instead of retrying forever)
spring.cassandra.reconnection-policy.base-delay=1s
spring.cassandra.reconnection-policy.max-delay=5s
spring.cassandra.pool.max-queue-size=256
spring.cassandra.request.consistency=LOCAL_QUORUM
spring.cassandra.request.serial-consistency=LOCAL_SERIAL

app.security.jwt.issuer=${APP_JWT_ISSUER:wikistreamkotlin-local}
app.security.jwt.secret=${APP_JWT_SECRET:local-jwt-secret-at-least-32-characters-long}
app.security.jwt.access-token-ttl-seconds=${APP_JWT_ACCESS_TOKEN_TTL_SECONDS:3600}

# Active-session enumeration micro-cache (ms). 0 disables (used in tests).
app.session.cache-ttl-ms=1000

#TODO: remove as unused
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8

# Public values
wiki.stream.url=https://stream.wikimedia.org/v2/stream/recentchange
wiki.stream.user-agent=wiki-stream-consumer/1.0 (https://github.com/you/wiki-stream)

# Kafka / Redpanda — override via SPRING_KAFKA_BOOTSTRAP_SERVERS env var in Docker
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.consumer.group-id=wiki-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=500
app.kafka.consumer.concurrency=4
spring.kafka.listener.ack-mode=manual

# Actuator configuration for Prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.base-path=/actuator
management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

