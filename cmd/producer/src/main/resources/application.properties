spring.application.name=wikistream-producer
spring.main.web-application-type=reactive
server.port=7002
wiki.stream.url=https://stream.wikimedia.org/v2/stream/recentchange
wiki.stream.user-agent=wikistream-producer/local

# Kafka / Redpanda — override via SPRING_KAFKA_BOOTSTRAP_SERVERS env var in Docker
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.producer.acks=all
spring.kafka.producer.compression-type=zstd
spring.kafka.producer.enable-idempotence=true

# Actuator configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.base-path=/actuator
management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
