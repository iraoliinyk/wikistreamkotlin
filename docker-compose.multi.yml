version: '3.8'

services:
  # JVM-based version (default, recommended for development)
  wikistreamkotlin-jvm:
    container_name: wikistreamkotlin-jvm
    image: wikistreamkotlin:jvm
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    restart: unless-stopped
    environment:
      - PORT=7000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/v1/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "variant=jvm"
      - "description=Standard JVM-based image (~500MB, 2-4s startup)"

  # Native image with dynamic linking (balanced approach)
  wikistreamkotlin-native:
    container_name: wikistreamkotlin-native
    image: wikistreamkotlin:native
    build:
      context: .
      dockerfile: Dockerfile.native
    ports:
      - "7001:7000"
    restart: unless-stopped
    environment:
      - PORT=7000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/v1/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "variant=native-dynamic"
      - "description=Native image with dynamic linking (~200MB, <1s startup)"
    depends_on:
      wikistreamkotlin-jvm:
        condition: service_healthy

  # Scratch-based image (minimal, requires docker buildx or native build)
  wikistreamkotlin-scratch:
    container_name: wikistreamkotlin-scratch
    image: wikistreamkotlin:scratch
    build:
      context: .
      dockerfile: Dockerfile.scratch
    ports:
      - "7002:7000"
    restart: unless-stopped
    environment:
      - PORT=7000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/v1/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "variant=scratch-static"
      - "description=Minimal scratch image (~100MB, <100ms startup)"
    depends_on:
      wikistreamkotlin-jvm:
        condition: service_healthy

