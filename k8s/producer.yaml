# producer.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: producer-config
data:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
  WIKI_STREAM_URL: "https://stream.wikimedia.org/v2/stream/recentchange"
  WIKI_STREAM_USER_AGENT: "wikistream-producer/k8s"
  SPRING_KAFKA_PRODUCER_ACKS: "all"
  SPRING_KAFKA_PRODUCER_COMPRESSION_TYPE: "zstd"
  SPRING_KAFKA_PRODUCER_ENABLE_IDEMPOTENCE: "true"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
---
apiVersion: v1
kind: Service
metadata:
  name: producer
  labels: { app: producer }
spec:
  selector: { app: producer }
  ports:
    - { name: http, port: 7002, targetPort: 7002 }   # named "http" for ServiceMonitor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
spec:
  replicas: 1
  selector: { matchLabels: { app: producer } }
  template:
    metadata:
      labels: { app: producer }
    spec:
      containers:
        - name: producer
          image: wikistream-producer:latest
          imagePullPolicy: Never           # use local Minikube image
          # The producer is a background SSE→Kafka pump driven by a blocking
          # CommandLineRunner, so Spring's ApplicationReadyEvent never fires and
          # the readiness *group* (/actuator/health/readiness) stays OUT_OF_SERVICE
          # forever. It serves no inbound traffic (Service is scrape-only), so we
          # gate on liveness — UP as soon as the management port is serving.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            # Gate on LIVENESS, not the readiness group: the blocking CommandLineRunner
            # means /actuator/health/readiness never leaves OUT_OF_SERVICE (503), which
            # would keep the pod NotReady forever and hang `kubectl rollout status`.
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          ports:
            - { name: http, containerPort: 7002 }
          envFrom:
            - configMapRef: { name: producer-config }   # ALL tunables injected here
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }