apiVersion: v1
kind: ConfigMap
metadata:
  name: rpcn-config
data:
  pipeline.yaml: |
    # <contents of rpcn/pipeline.yaml>
  wikievent.proto: |
    # <contents of lib/core/src/main/proto/wikievent.proto>
---
apiVersion: v1
kind: Service
metadata:
  name: rpcn
  labels: { app: rpcn }
spec:
  selector: { app: rpcn }
  ports:
    - { name: http, port: 4195, targetPort: 4195 }   # named "http" for the ServiceMonitor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpcn
spec:
  replicas: 1              # scale to N<=6 freely: consumer-group rebalance handles it
  selector: { matchLabels: { app: rpcn } }
  template:
    metadata: { labels: { app: rpcn } }
    spec:
      containers:
        - name: rpcn
          image: redpandadata/connect:4.99.0
          args: [ "run", "/etc/rpcn/pipeline.yaml" ]
          env:
            - { name: RPCN_BROKERS, value: "redpanda:9092" }
            - { name: RPCN_PROTO_DIR, value: "/etc/rpcn/proto" }
          ports: [ { name: http, containerPort: 4195 } ]
          volumeMounts:
            - { name: cfg, mountPath: /etc/rpcn/pipeline.yaml, subPath: pipeline.yaml }
            - { name: cfg, mountPath: /etc/rpcn/proto/wikievent.proto, subPath: wikievent.proto }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /ping,  port: http }, periodSeconds: 15 }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: cfg
          configMap: { name: rpcn-config }