# Redpanda (Kafka-compatible broker) — single-node StatefulSet.
# Mirrors docker-compose.yml (redpandadata/redpanda:v24.3.14).
#
# Apply with:
#   kubectl apply -f k8s/redpanda.yaml
#   kubectl rollout status statefulset/redpanda
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    app: redpanda
spec:
  clusterIP: None          # headless — stable DNS redpanda-0.redpanda
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.3.14
          args:
            - redpanda
            - start
            - --smp=1
            - --memory=1G
            - --overprovisioned
            - --node-id=0
            - --check=false
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda:9092
          ports:
            - name: kafka
              containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
