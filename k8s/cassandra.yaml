# cassandra.yaml
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  labels: { app: cassandra }
spec:
  clusterIP: None          # headless: enables stable per-pod DNS for peer discovery
  selector: { app: cassandra }
  ports:
    - { name: cql, port: 9042, targetPort: 9042 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
spec:
  serviceName: cassandra
  replicas: 3
  selector: { matchLabels: { app: cassandra } }
  template:
    metadata:
      labels: { app: cassandra }
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: cassandra
          image: cassandra:5.0
          ports:
            - { name: cql,   containerPort: 9042 }
            - { name: intra, containerPort: 7000 }
          resources:
            # requests sized to real steady-state usage (~1.3Gi with a 768M heap)
            # so the scheduler doesn't overpack the single Minikube node; the 2Gi
            # limit leaves headroom for off-heap + transient nodetool probe JVMs.
            requests: { cpu: "500m", memory: "1536Mi" }
            limits:   { cpu: "1",    memory: "2Gi" }
          env:
            - { name: CASSANDRA_CLUSTER_NAME, value: "wikistream-cluster" }
            - { name: CASSANDRA_DC,           value: "datacenter1" }
            - { name: CASSANDRA_RACK,         value: "rack1" }
            - { name: CASSANDRA_ENDPOINT_SNITCH, value: "GossipingPropertyFileSnitch" }
            - name: CASSANDRA_SEEDS
              value: "cassandra-0.cassandra.wikistream.svc.cluster.local,cassandra-1.cassandra.wikistream.svc.cluster.local"
            # Constrained heap for local Minikube (3 replicas on one node). The dev
            # dataset is tiny, so 768M is comfortable and keeps per-pod RSS ~1.3Gi.
            - name: MAX_HEAP_SIZE
              value: "768M"
            - name: HEAP_NEWSIZE
              value: "128M"
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: CASSANDRA_BROADCAST_ADDRESS
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          readinessProbe:
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  nodetool status | grep "$(hostname -i)" | grep -q '^UN'
          volumeMounts:
            - { name: data, mountPath: /var/lib/cassandra }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources: { requests: { storage: 5Gi } }