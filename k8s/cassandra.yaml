# cassandra.yaml
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  labels: { app: cassandra }
spec:
  clusterIP: None          # headless: enables stable per-pod DNS for peer discovery
  selector: { app: cassandra }
  ports:
    - { name: cql, port: 9042, targetPort: 9042 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
spec:
  serviceName: cassandra
  replicas: 3
  selector: { matchLabels: { app: cassandra } }
  template:
    metadata:
      labels: { app: cassandra }
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: cassandra
          image: cassandra:4.1
          ports:
            - { name: cql,   containerPort: 9042 }
            - { name: intra, containerPort: 7000 }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "1",    memory: "2Gi" }
          env:
            - { name: CASSANDRA_CLUSTER_NAME, value: "wikistream-cluster" }
            - { name: CASSANDRA_DC,           value: "datacenter1" }
            - { name: CASSANDRA_RACK,         value: "rack1" }
            - { name: CASSANDRA_ENDPOINT_SNITCH, value: "GossipingPropertyFileSnitch" }
            - name: CASSANDRA_SEEDS
              value: "cassandra-0.cassandra.wikistream.svc.cluster.local"
            - name: MAX_HEAP_SIZE
              value: "1G"
            - name: HEAP_NEWSIZE
              value: "256M"
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: CASSANDRA_BROADCAST_ADDRESS
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          readinessProbe:
            exec: { command: ["/bin/sh","-c","nodetool status | grep -E '^UN'"] }
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/cassandra }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources: { requests: { storage: 5Gi } }