services:
  redis:
    image: redis:7
    container_name: wikistream-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 2s
      retries: 5

  wikistreamkotlin:
    container_name: wikistreamkotlin
    image: wikistreamkotlin:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    environment:
      APP_STATS_REPOSITORY_TYPE: cassandra
      SPRING_PROFILES_ACTIVE: astra
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 2000ms
      APP_SESSION_BACKEND: redis
    ports:
      - "7000:7000"
    restart: unless-stopped