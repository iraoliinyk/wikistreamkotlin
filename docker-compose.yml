services:
  redis:
    image: redis:7
    container_name: wikistream-redis
    profiles: ["redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 2s
      retries: 5

  cassandra:
    container_name: wikistreamkotlin-cassandra
    image: cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: wikistream-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  cassandra-init:
    container_name: wikistreamkotlin-cassandra-init
    image: cassandra:5.0
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./src/main/resources/db/cassandra/schema.cql:/schema.cql:ro
    entrypoint: ["/bin/sh", "-c", "cqlsh cassandra 9042 -f /schema.cql"]
    restart: "no"

  wikistreamkotlin:
    container_name: wikistreamkotlin
    image: wikistreamkotlin:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
        required: false
      cassandra-init:
        condition: service_completed_successfully
    environment:
      APP_JWT_ISSUER: wikistreamkotlin-local
      APP_JWT_SECRET: local-jwt-secret-at-least-32-characters-long
      APP_JWT_ACCESS_TOKEN_TTL_SECONDS: 3600
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE_NAME: wikistream
      CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 2000ms
      APP_SESSION_BACKEND: ${APP_SESSION_BACKEND}
      APP_AUTH_ENABLED: ${APP_AUTH_ENABLED:-true}

    ports:
      - "7000:7000"
    restart: unless-stopped

