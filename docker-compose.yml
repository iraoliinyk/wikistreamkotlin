# ─── Production/Demo Stack ────────────────────────────────────────────────────
# Full stack: Redpanda, Astra (cloud Cassandra), Redis, Consumer app, Producer app
#
# Features:
#   - Uses DataStax Astra for cloud Cassandra (requires config/cassandra-astra-secrets.properties)
#   - Redis enabled by default (configurable via APP_SESSION_BACKEND)
#   - Consumer + Producer apps include by default
#   - Redpanda Console for topic monitoring
#
# Usage:
#   docker compose up --build -d          # Full stack with defaults
#   docker compose down                   # Stop everything
#
# Environment variables:
#   APP_AUTH_ENABLED             default: true
#   APP_SESSION_BACKEND          default: redis (or set to in-memory)
#   CONSUMER_PORT                default: 7001
#
# ──────────────────────────────────────────────────────────────────────────────


services:

  # ── Redpanda (Kafka-compatible broker) ──────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.3.14
    container_name: wikistream-redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redpanda-init:
    image: redpandadata/redpanda:v24.3.14
    container_name: wikistream-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        # DEPRECATED — JSON-based raw stream, kept for backward-compatibility only
        rpk topic create wiki.recentchange.raw \
          --brokers redpanda:9092 \
          --partitions 3 --replicas 1 \
          -c cleanup.policy=delete \
          -c retention.ms=86400000 \
          -c compression.type=producer || true

        # Canonical Protobuf event stream — supersedes wiki.recentchange.raw
        #
        # partitions=6 : 2× raw, room for parallel consumers without rebalance overhead
        # cleanup.policy=delete : time-based expiry; compaction makes no sense for immutable edits
        # retention.ms=604800000 : 7-day window — protobuf is ~75 % smaller than JSON so the
        #                          same storage budget now covers a full week of edits
        # compression.type=zstd : enforced at topic level so every producer is consistent;
        #                         zstd gives the best ratio (~4:1) with reasonable CPU cost
        # min.insync.replicas=1 : single-node cluster; set to 2 in multi-broker production
        # message.timestamp.type=CreateTime : preserves the actual Wikipedia edit time as
        #                                     captured by the SSE producer, not broker-append time
        # max.message.bytes=524288 : 512 KB hard ceiling — a protobuf WikiEvent is ~300-600 B;
        #                            this blocks runaway payloads while still allowing headroom
        rpk topic create wiki.recentchange.proto \
          --brokers redpanda:9092 \
          --partitions 6 --replicas 1 \
          -c cleanup.policy=delete \
          -c retention.ms=604800000 \
          -c compression.type=zstd \
          -c min.insync.replicas=1 \
          -c message.timestamp.type=CreateTime \
          -c max.message.bytes=524288 || true
        
        rpk topic create wiki.recentchange.dlq \
           --brokers redpanda:9092 \
           --partitions 1 --replicas 1 \
           -c cleanup.policy=delete \
           -c retention.ms=604800000 \
           -c compression.type=zstd || true

    restart: "no"

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wikistream-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  # ── Redpanda Console (UI for monitoring) ───────────────────────────────────
  # Using v2.8.1 which supports file-based protobuf deserialization + BigInt fix
  redpanda-console:
    image: redpandadata/console:v2.8.1
    container_name: wikistream-redpanda-console
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    volumes:
      - ./lib/core/src/main/proto:/etc/proto:ro
      - ./config/redpanda-console.yaml:/etc/redpanda-console.yaml:ro
    environment:
      CONFIG_FILEPATH: /etc/redpanda-console.yaml
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ─── Application services ──────────────────────────────────────────────────
  consumer:
    container_name: wikistream-consumer
    image: wikistream-consumer:latest
    build:
      context: .
      dockerfile: Dockerfile.consumer
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    environment:
      APP_AUTH_ENABLED: ${APP_AUTH_ENABLED:-true}
      APP_SESSION_BACKEND: ${APP_SESSION_BACKEND:-redis}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "${CONSUMER_PORT:-7001}:7000"
    restart: unless-stopped

  producer:
    container_name: wikistream-producer
    image: wikistream-producer:latest
    build:
      context: .
      dockerfile: Dockerfile.producer
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "7002:7002"
    restart: unless-stopped
