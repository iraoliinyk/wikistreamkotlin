# Redpanda Console configuration with protobuf deserialization
kafka:
  brokers:
    - redpanda:9092
  protobuf:
    enabled: true
    mappings:
      # Canonical stream — Protobuf-encoded WikiEvent
      - topicName: "wiki.recentchange.proto"
        valueProtoType: "com.redspace.wikistreamkotlin.proto.WikiEvent"

      # RPCN-validated stream — byte-identical protobuf pass-through of .proto
      # (RPCN validates via decode but republishes the original bytes unchanged).
      - topicName: "wiki.recentchange.validated"
        valueProtoType: "com.redspace.wikistreamkotlin.proto.WikiEvent"

      - topicName: "wiki.recentchange.dlq"
        valueProtoType: "com.redspace.wikistreamkotlin.proto.WikiEvent"
    fileSystem:
      enabled: true
      refreshInterval: 5m
      paths:
        - "/etc/proto"
