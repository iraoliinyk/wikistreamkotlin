# ─── Development Mode: Infrastructure Only ────────────────────────────────────
# For running apps locally from IDE/Gradle with Docker-based infra.
#
# What this stack provides:
#   - Redpanda (Kafka-compatible broker)            — localhost:19092
#   - 3-node Cassandra cluster (RF=3, LOCAL_QUORUM) — localhost:19042 (node-1)
#   - cassandra-init job that applies schema.cql once the cluster has 3 UN nodes
#   - Redis (session storage)                       — localhost:6379
#   - Redpanda Console (Kafka UI)                   — localhost:8080
#
# Production parity: matches the Astra topology used by docker-compose.yml
# (NetworkTopologyStrategy { datacenter1: 3 }) so LOCAL_QUORUM never has to be
# weakened for dev. The Datastax driver only needs to reach ONE node
# (cassandra-1, exposed on host port 19042); that node is the coordinator and
# delegates to the other replicas over the internal Docker network.
#
# Example usage:
#   docker compose -f docker-compose.dev.yml up -d                       # Full infrastructure
#   docker compose -f docker-compose.dev.yml --profile monitoring up -d  # With Prometheus + Grafana
#   docker compose -f docker-compose.dev.yml down -v --remove-orphans    # Tear down + wipe volumes
#
# First boot takes ~2–3 minutes: nodes start serially (cassandra-1 → -2 → -3),
# and cassandra-1 only reports healthy after `nodetool status` shows three UN nodes.
# The cassandra-init job then applies schema.cql against the fully-formed cluster.
#
# ─── Switching to Astra cloud Cassandra ───────────────────────────────────────
# 1. cp config/cassandra-astra-secrets.properties.template config/cassandra-astra-secrets.properties
# 2. Fill in Astra DB token, bundle path, keyspace, local-datacenter.
# 3. Set spring.profiles.active=astra in that file (default in the template).
# 4. Start infra without the Cassandra cluster:
#      docker compose -f docker-compose.dev.yml up -d redpanda redpanda-init redis redpanda-console
# 5. Run the app: it will pick up the astra profile and ignore spring.cassandra.contact-points.
#
# ─── Profiles ──────────────────────────────────────────────────────────────────
# monitoring:  Optional Prometheus + Grafana for metrics visualization
#
# ──────────────────────────────────────────────────────────────────────────────

networks:
  wikistream-net:
    name: wikistream-net
    driver: bridge

services:

  # ── Redpanda (Kafka-compatible broker) ──────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.3.14
    container_name: wikistream-redpanda
    networks: [ wikistream-net ]
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redpanda-init:
    image: redpandadata/redpanda:v24.3.14
    container_name: wikistream-redpanda-init
    networks: [ wikistream-net ]
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Canonical Protobuf event stream
        #
        # partitions=6 : room for parallel consumers without rebalance overhead
        # cleanup.policy=delete : time-based expiry; compaction makes no sense for immutable edits
        # retention.ms=604800000 : 7-day window — protobuf is ~75 % smaller than JSON so the
        #                          same storage budget now covers a full week of edits
        # compression.type=zstd : enforced at topic level so every producer is consistent;
        #                         zstd gives the best ratio (~4:1) with reasonable CPU cost
        # min.insync.replicas=1 : single-node cluster; set to 2 in multi-broker production
        # message.timestamp.type=CreateTime : preserves the actual Wikipedia edit time as
        #                                     captured by the SSE producer, not broker-append time
        # max.message.bytes=524288 : 512 KB hard ceiling — a protobuf WikiEvent is ~300-600 B;
        #                            this blocks runaway payloads while still allowing headroom
        rpk topic create wiki.recentchange.proto \
          --brokers redpanda:9092 \
          --partitions 6 --replicas 1 \
          -c cleanup.policy=delete \
          -c retention.ms=604800000 \
          -c compression.type=zstd \
          -c min.insync.replicas=1 \
          -c message.timestamp.type=CreateTime \
          -c max.message.bytes=524288 || true

        rpk topic create wiki.recentchange.dlq \
           --brokers redpanda:9092 \
           --partitions 1 --replicas 1 \
           -c cleanup.policy=delete \
           -c retention.ms=604800000 \
           -c compression.type=zstd || true
        
        rpk topic create wiki.recentchange.validated --brokers redpanda:9092 \
          --partitions 6 --replicas 1 \
          -c cleanup.policy=delete -c retention.ms=604800000 \
          -c compression.type=zstd -c min.insync.replicas=1 \
          -c message.timestamp.type=CreateTime -c max.message.bytes=524288 || true
    restart: "no"

  # ── Cassandra 3-node cluster (production-equivalent, RF=3, LOCAL_QUORUM) ─────
  # Nodes start serially: each waits for the previous to be healthy so the
  # gossip seed list stabilizes before the next joins. Only node-1 is exposed
  # to the host (port 19042); the driver only needs ONE reachable contact
  # point — it talks to that coordinator, which then talks to replicas via
  # the internal Docker network.
  cassandra-1:
    image: cassandra:5.0
    container_name: wikistream-cassandra-1
    hostname: cassandra-1
    networks: [ wikistream-net ]
    ports:
      - "19042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: wikistream-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1,cassandra-2
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      JVM_OPTS: "-Dcassandra.skip_wait_for_gossip_to_settle=0"
    healthcheck:
      # Healthy only when the whole cluster has 3 Up/Normal nodes.
      test: [ "CMD-SHELL", "nodetool status | awk '/^UN/ {c++} END {exit !(c==3)}'" ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    restart: unless-stopped

  cassandra-2:
    image: cassandra:5.0
    container_name: wikistream-cassandra-2
    hostname: cassandra-2
    networks: [ wikistream-net ]
    depends_on:
      cassandra-1:
        condition: service_started
    environment:
      CASSANDRA_CLUSTER_NAME: wikistream-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1,cassandra-2
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    restart: unless-stopped


  cassandra-3:
    image: cassandra:5.0
    container_name: wikistream-cassandra-3
    hostname: cassandra-3
    networks: [ wikistream-net ]
    depends_on:
      cassandra-2:
        condition: service_started
    environment:
      CASSANDRA_CLUSTER_NAME: wikistream-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1,cassandra-2
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    restart: unless-stopped

  cassandra-init:
    image: cassandra:5.0
    container_name: wikistream-cassandra-init
    networks: [ wikistream-net ]
    depends_on:
      cassandra-1:
        # cassandra-1 only becomes healthy when all 3 nodes are UN,
        # so by the time the schema is applied RF=3 is fully satisfiable.
        condition: service_healthy
    volumes:
      - ./cmd/consumer/src/main/resources/db/cassandra/schema.cql:/schema.cql:ro
    entrypoint: [ "/bin/sh", "-c", "cqlsh cassandra-1 9042 -f /schema.cql" ]
    restart: "no"

  # ── Redis (required for session storage) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wikistream-redis
    networks: [ wikistream-net ]
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  # ── Redpanda Console (UI for monitoring) ───────────────────────────────────
  # Using v2.8.1 which supports file-based protobuf deserialization + BigInt fix
  redpanda-console:
    image: redpandadata/console:v2.8.1
    networks: [ wikistream-net ]
    container_name: wikistream-redpanda-console
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    volumes:
      - ./lib/core/src/main/proto:/etc/proto:ro
      - ./config/redpanda-console.yaml:/etc/redpanda-console.yaml:ro
    environment:
      CONFIG_FILEPATH: /etc/redpanda-console.yaml
    ports:
      - "8080:8080"
    restart: unless-stopped

  rpcn:
    image: redpandadata/connect:4.99.0     # pin; verify latest 4.x at implementation time
    container_name: wikistream-rpcn
    networks: [ wikistream-net ]
    command: [ "run", "/etc/rpcn/pipeline.yaml" ]
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    volumes:
      - ./rpcn/pipeline.yaml:/etc/rpcn/pipeline.yaml:ro
      - ./lib/core/src/main/proto:/etc/rpcn/proto:ro
    environment:
      RPCN_BROKERS: redpanda:9092
    ports: [ "4195:4195" ]
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:4195/ready" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Consumer (in-network dev) ───────────────────────────────────────────────
  # Runs the consumer INSIDE wikistream-net so it can reach the 3-node Cassandra
  # cluster at its advertised internal addresses (172.20.x). Host-run bootRun
  # cannot: the driver discovers each node's internal rpc_address via system.peers
  # and those bridge IPs are not routable from the macOS host.
  #
  # Behind the `apps` profile so a bare `up -d` stays infra-only. Start with:
  #   docker compose -f docker-compose.dev.yml up -d --build consumer
  consumer:
    profiles: [ "apps" ]
    container_name: wikistream-consumer
    image: wikistream-consumer:latest
    build:
      context: .
      dockerfile: Dockerfile.consumer
    networks: [ wikistream-net ]
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rpcn:
        condition: service_healthy
    environment:
      # Auth / JWT
      APP_AUTH_ENABLED: ${APP_AUTH_ENABLED:-true}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-wikistream-local}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-jwt-secret-at-least-32-characters-long}
      APP_JWT_ACCESS_TOKEN_TTL_SECONDS: ${APP_JWT_ACCESS_TOKEN_TTL_SECONDS:-3600}
      # Redis + Kafka (in-network hostnames)
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Local 3-node Cassandra — reach cassandra-1 by service name on the native port
      CASSANDRA_CONTACT_POINTS: cassandra-1
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE_NAME: wikistream
      CASSANDRA_LOCAL_DATACENTER: datacenter1
      CASSANDRA_SCHEMA_ACTION: NONE
    ports:
      - "${CONSUMER_PORT:-7001}:7000"
    restart: unless-stopped