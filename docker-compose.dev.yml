# ─── Development Mode: Infrastructure Only ────────────────────────────────────
# For running apps locally from IDE with Docker-based infra.
#
# Supports:
#   - Cassandra: local cassandra:5.0
#   - Astra: DataStax Astra (cloud) — requires config/cassandra-astra-secrets.properties
#   - Session backend: Redis or in-memory
#
# Example usage:
#   docker compose -f docker-compose.dev.yml up -d                 # local cassandra (default)
#   docker compose -f docker-compose.dev.yml --profile redis up -d # with Redis
#   CASSANDRA_MODE=astra docker compose -f docker-compose.dev.yml up -d  # switch to Astra
#
# ─── Profiles ──────────────────────────────────────────────────────────────────
# redis:       Optional Redis for session backend (off by default = in-memory)
# cassandra:   Local Cassandra (on by default, unless CASSANDRA_MODE=astra)
#
# ──────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:

  # ── Redpanda (Kafka-compatible broker) ──────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.3.14
    container_name: wikistream-redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redpanda-init:
    image: redpandadata/redpanda:v24.3.14
    container_name: wikistream-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        rpk topic create wiki.recentchange.raw --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create wiki.recentchange.dlq --brokers redpanda:9092 --partitions 1 --replicas 1 || true
    restart: "no"

  # ── Cassandra (local development mode) ──────────────────────────────────────
  # NOTE: Cassandra always starts in dev mode. For Astra, use docker-compose.yml instead.
  cassandra:
    image: cassandra:5.0
    container_name: wikistream-cassandra
    ports:
      - "19042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: wikistream-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  cassandra-init:
    image: cassandra:5.0
    container_name: wikistream-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cmd/consumer/src/main/resources/db/cassandra/schema.cql:/schema.cql:ro
    entrypoint: ["/bin/sh", "-c", "cqlsh cassandra 9042 -f /schema.cql"]
    restart: "no"

  # ── Redis (optional — only when needed for session backend) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: wikistream-redis
    profiles: ["redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  # ── Redpanda Console (UI for monitoring) ───────────────────────────────────
  redpanda-console:
    image: redpandadata/console:latest
    container_name: wikistream-redpanda-console
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_ENABLED: "false"
    ports:
      - "8080:8080"
    restart: unless-stopped

