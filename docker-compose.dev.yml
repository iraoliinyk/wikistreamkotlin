# ─── Development Mode: Infrastructure Only ────────────────────────────────────
# For running apps locally from IDE with Docker-based infra.
#
# Supports:
#   - Cassandra: local cassandra:5.0 (default)
#   - Astra: DataStax Astra (cloud) — requires config/cassandra-astra-secrets.properties
#   - Session backend: Redis or in-memory
#
# Example usage:
#   docker compose -f docker-compose.dev.yml up -d                 # local cassandra (default)
#   docker compose -f docker-compose.dev.yml --profile redis up -d # with Redis
#
# ─── Switching Database Backends ────────────────────────────────────────────────
# LOCAL CASSANDRA (default):
#   docker compose -f docker-compose.dev.yml up -d
#   CASSANDRA_CONTACT_POINTS=127.0.0.1 CASSANDRA_PORT=19042 ./gradlew :cmd:consumer:bootRun
#
# ASTRA CLOUD CASSANDRA:
#   1. Prepare: cp config/cassandra-astra-secrets.properties.template config/cassandra-astra-secrets.properties
#   2. Edit file with your Astra credentials (DB ID, region, token)
#   3. Start infra: docker compose -f docker-compose.dev.yml up -d
#   4. Run app: ./gradlew :cmd:consumer:bootRun
#      (app auto-activates astra profile; see config/cassandra-astra-secrets.properties:1)
#
# NOTE: The cassandra service ALWAYS starts by default. It does NOT consume resources if apps
#       use Astra (via spring.profiles.active=astra). To skip cassandra entirely, use profiles:
#       docker compose -f docker-compose.dev.yml --profile cassandra down
#       docker compose -f docker-compose.dev.yml up -d  # Skips cassandra
#
# ─── Profiles ──────────────────────────────────────────────────────────────────
# redis:       Optional Redis for session backend (off by default = in-memory)
#
# ──────────────────────────────────────────────────────────────────────────────


services:

  # ── Redpanda (Kafka-compatible broker) ──────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.3.14
    container_name: wikistream-redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redpanda-init:
    image: redpandadata/redpanda:v24.3.14
    container_name: wikistream-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        # DEPRECATED — JSON-based raw stream, kept for backward-compatibility only
        rpk topic create wiki.recentchange.raw \
          --brokers redpanda:9092 \
          --partitions 3 --replicas 1 \
          -c cleanup.policy=delete \
          -c retention.ms=86400000 \
          -c compression.type=producer || true

        # Canonical Protobuf event stream — supersedes wiki.recentchange.raw
        #
        # partitions=6 : 2× raw, room for parallel consumers without rebalance overhead
        # cleanup.policy=delete : time-based expiry; compaction makes no sense for immutable edits
        # retention.ms=604800000 : 7-day window — protobuf is ~75 % smaller than JSON so the
        #                          same storage budget now covers a full week of edits
        # compression.type=zstd : enforced at topic level so every producer is consistent;
        #                         zstd gives the best ratio (~4:1) with reasonable CPU cost
        # min.insync.replicas=1 : single-node cluster; set to 2 in multi-broker production
        # message.timestamp.type=CreateTime : preserves the actual Wikipedia edit time as
        #                                     captured by the SSE producer, not broker-append time
        # max.message.bytes=524288 : 512 KB hard ceiling — a protobuf WikiEvent is ~300-600 B;
        #                            this blocks runaway payloads while still allowing headroom
        rpk topic create wiki.recentchange.proto \
          --brokers redpanda:9092 \
          --partitions 6 --replicas 1 \
          -c cleanup.policy=delete \
          -c retention.ms=604800000 \
          -c compression.type=zstd \
          -c min.insync.replicas=1 \
          -c message.timestamp.type=CreateTime \
          -c max.message.bytes=524288 || true

        rpk topic create wiki.recentchange.dlq --brokers redpanda:9092 --partitions 1 --replicas 1 || true
    restart: "no"

  # ── Cassandra (local development mode) ──────────────────────────────────────
  # Starts by default. Apps using Astra (spring.profiles.active=astra) will ignore this.
  # To skip Cassandra entirely: docker compose -f docker-compose.dev.yml down && \
  #                             docker compose -f docker-compose.dev.yml up -d
  cassandra:
    image: cassandra:5.0
    container_name: wikistream-cassandra
    ports:
      - "19042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: wikistream-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  cassandra-init:
    image: cassandra:5.0
    container_name: wikistream-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cmd/consumer/src/main/resources/db/cassandra/schema.cql:/schema.cql:ro
    entrypoint: ["/bin/sh", "-c", "cqlsh cassandra 9042 -f /schema.cql"]
    restart: "no"

  # ── Redis (optional — only when needed for session backend) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: wikistream-redis
    profiles: ["redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  # ── Redpanda Console (UI for monitoring) ───────────────────────────────────
  # Using v2.8.1 which supports file-based protobuf deserialization + BigInt fix
  redpanda-console:
    image: redpandadata/console:v2.8.1
    container_name: wikistream-redpanda-console
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    volumes:
      - ./lib/core/src/main/proto:/etc/proto:ro
      - ./config/redpanda-console.yaml:/etc/redpanda-console.yaml:ro
    environment:
      CONFIG_FILEPATH: /etc/redpanda-console.yaml
    ports:
      - "8080:8080"
    restart: unless-stopped

