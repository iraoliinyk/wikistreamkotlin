spring.config.activate.on-profile=astra

astra.db.enabled=true
spring.cassandra.keyspace-name=${ASTRA_DB_KEYSPACE:default-db-keyspace}
# Keep a local datacenter fallback for driver compatibility; Astra overrides via secure connect bundle.
spring.cassandra.local-datacenter=${ASTRA_DB_LOCAL_DATACENTER:us-east-2}

