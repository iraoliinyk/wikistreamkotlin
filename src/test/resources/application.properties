app.stats.repository.type=in-memory
app.auth.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.cassandra.autoconfigure.CassandraAutoConfiguration,org.springframework.boot.data.cassandra.autoconfigure.DataCassandraAutoConfiguration,org.springframework.boot.data.cassandra.autoconfigure.DataCassandraRepositoriesAutoConfiguration
wiki.stream.url=https://stream.wikimedia.org/v2/stream/recentchange
wiki.stream.user-agent=wiki-stream-consumer-test/1.0
app.security.jwt.issuer=wikistreamkotlin-test
app.security.jwt.secret=test-jwt-secret-at-least-32-chars
app.security.jwt.access-token-ttl-seconds=3600
app.session.backend=in-memory