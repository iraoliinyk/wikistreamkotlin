http:
  enabled: true
  address: 0.0.0.0:4195          # /ping (liveness), /ready (readiness), /metrics

# Redpanda Connect: decode + validate wiki.recentchange.proto → validated/DLQ.
# Stateless only — sessions, aggregation, and Cassandra stay in the Spring consumer.
input:
  redpanda:
    seed_brokers: [ "${REDPANDA_BROKERS:redpanda:9092}" ]
    topics: [ "wiki.recentchange.proto" ]
    consumer_group: "rpcn-validator"        # isolated from "wiki-consumer"
    # checkpoint_limit moved under unordered_processing in connect 4.x. Bounds
    # in-flight (checkpointed-but-uncommitted) records to cap the at-least-once
    # double-count window described in NO_REDIS.md §2.2.
    unordered_processing:
      enabled: true
      checkpoint_limit: 1024

pipeline:
  processors:
    # Keep the original bytes so the DLQ carries the raw record, matching
    # DlqPublisher's behavior of forwarding the original value.
    - mapping: |
        meta raw_payload = content()

    - try:
        - protobuf:
            operator: to_json
            message: com.redspace.wikistreamkotlin.proto.WikiEvent
            import_paths: [ "/etc/rpcn/proto" ]

        # Why we validate here:
        # This is a quality gate. Every event that reaches wiki.recentchange.validated
        # must be a valid WikiEvent, so the consumer can trust it and does not need to
        # check the fields again.
        #  - The consumer writes per-user stats into Cassandra COUNTER columns. Counters
        #    cannot be undone, so bad data (for example an empty user) would create junk
        #    rows that are hard to fix later. We stop such events before they are counted.
        #  - Bad events could also make the consumer fail while reading a batch. Rejecting
        #    them here keeps the consumer simple and stable.
        #  - Rejected events are not lost: they go to the DLQ with error headers, so we can
        #    see what was wrong and replay them later.
        # A failed rule calls throw(), which marks the message failed and sends it to the
        # catch block below.
        # NOTE: verify decoded field casing during implementation — protobuf
        # to_json emits lowerCamelCase (serverUrl) by default.
        - label: validate_wiki_event
          mapping: |
            root = this
            # Each rule is `root = if <bad> { throw(...) }`: a false condition with
            # no else abandons the assignment (root keeps `this`), a true condition
            # throws and flags the message failed -> catch block. A bare `throw()`
            # is not a valid Bloblang statement — assignments only.
            root = if this.user.or("").trim() == "" {
              throw("validation: user must be non-empty")
            }
            root = if this.title.or("").trim() == "" {
              throw("validation: title must be non-empty")
            }
            root = if !this.serverUrl.or("").re_match("^https?://[A-Za-z0-9.-]+") {
              throw("validation: server_url malformed: " + this.serverUrl.or("<missing>"))
            }
            # timestamp is unix seconds; reject pre-2001 (Wikipedia epoch) or >5min future
            let ts = this.timestamp.or(0).number()
            root = if $ts < 978307200 || $ts > (now().ts_unix() + 300) {
              throw("validation: timestamp out of range: " + $ts.string())
            }

        # Consumer still deserializes protobuf (ProtoWikiEventDeserializer),
        # so re-encode before republishing.
        - protobuf:
            operator: from_json
            message: com.redspace.wikistreamkotlin.proto.WikiEvent
            import_paths: [ "/etc/rpcn/proto" ]
        - mapping: |
            meta rpcn_valid = "true"

    - catch:
        # Reuse DlqPublisher's exact header contract so DLQ tooling is
        # producer-agnostic: dlq.error.message / dlq.error.class /
        # dlq.source.{topic,partition,offset}.
        - mapping: |
            root = meta("raw_payload")
            meta rpcn_valid             = "false"
            meta "dlq.error.message"    = error()
            meta "dlq.error.class"      = "RpcnValidationError"
            meta "dlq.source.topic"     = meta("kafka_topic")
            meta "dlq.source.partition" = meta("kafka_partition")
            meta "dlq.source.offset"    = meta("kafka_offset")

output:
  switch:
    cases:
      - check: 'meta("rpcn_valid") == "true"'
        output:
          redpanda:
            seed_brokers: [ "${REDPANDA_BROKERS:redpanda:9092}" ]
            topic: "wiki.recentchange.validated"
            key: '${! meta("kafka_key") }'
            metadata:
              include_patterns: []            # clean stream: no internal headers
            batching:                         # produce-side batching only;
              count: 200                      # the Spring batch listener still
              period: 100ms                   # owns consume-side batching
              byte_size: 1048576
      - output:
          redpanda:
            seed_brokers: [ "${REDPANDA_BROKERS:redpanda:9092}" ]
            topic: "wiki.recentchange.dlq"
            key: '${! meta("kafka_key") }'
            metadata:
              include_patterns: [ "^dlq\\." ] # only the 5 contract headers

metrics:
  prometheus:
    add_process_metrics: true

logger:
  level: INFO